function inFilter(w){if(ui.filter==='favorites')return inFav(w.id);if(ui.filter==='review')return inReview(w.id);if(ui.filter==='due')return due(w);if(ui.filter==='custom')return w.id.startsWith('u');return ui.filter==='all'||w.cat===ui.filter;}

function reviewPage(){const list=state.reviewList.filter(id=>lookup(id)),favs=state.favorites.filter(id=>lookup(id)),dueItems=words().filter(w=>due(w)&&known(w.id).seen>0);return `<div class="study-head"><div><h1>🔖 المفضلة والمراجعة</h1><p>اصنع قائمة خاصة بك لكلمات المقابلة المهمة</p></div></div><div class="stats"><div class="stat"><span>المفضلة</span><strong>${favs.length}</strong><small>⭐ محفوظة</small></div><div class="stat"><span>للمراجعة</span><strong>${list.length}</strong><small>📌 مثبتة</small></div><div class="stat"><span>حان موعدها</span><strong>${dueItems.length}</strong><small>🔁 مراجعة متباعدة</small></div></div><div class="panel"><h2>ابدأ جلسة مخصصة</h2><div class="buttons"><button class="btn btn-teal" data-action="start-list" data-mode="review" ${!list.length?'disabled':''}>📌 راجع قائمتي (${list.length})</button><button class="btn btn-outline" data-action="start-list" data-mode="favorites" ${!favs.length?'disabled':''}>⭐ بطاقات المفضلة (${favs.length})</button><button class="btn btn-outline" data-action="start-list" data-mode="due">🔁 مراجعة اليوم</button></div></div><div class="section-title"><h2>📌 كلمات للمراجعة</h2></div><div class="pin-list">${list.length?list.map(id=>miniPinned(lookup(id),'review')).join(''):'<p class="muted">أضف كلمات من البطاقات أو القاموس باستخدام زر «أراجعها لاحقاً».</p>'}</div><div class="section-title"><h2>⭐ المفضلة</h2></div><div class="pin-list">${favs.length?favs.map(id=>miniPinned(lookup(id),'favorites')).join(''):'<p class="muted">المفضلة فارغة؛ اختر كلمات مهمّة من القاموس.</p>'}</div>`;}

function createQuiz(){const pool=shuffle(words()).slice(0,10);ui.quiz={ids:pool.map(x=>x.id),index:0,selected:null,correct:0,choices:[]};createChoices();}

function createMatch(){const a=[],seen=new Set();for(const w of shuffle(words())){const k=norm(w[ui.matchLang]);if(!k||seen.has(k))continue;seen.add(k);a.push(w);if(a.length===4)break;}ui.match={ids:a.map(w=>w.id),left:shuffle(a.map(w=>w.id)),right:shuffle(a.map(w=>w.id)),selected:null,solved:[]};}

function exerciseLocalFeedback(e,answer){
 const spellingText=String(answer||'').normalize('NFC').toLowerCase();
 const tx=norm(answer),checks=Array.isArray(e.checks)?e.checks:[];
 const spell=[['comprandre','comprendre'],['diferent','différent'],['comande','commande'],['deuxiem','deuxième'],['foix','fois'],['conection','connexion / conversation selon le sens'],['archife','archives'],['verifier','vérifier (accent)']];
 const misses=spell.filter(([bad])=>new RegExp('(^|[^\\p{L}])'+bad+'(?=$|[^\\p{L}])','iu').test(spellingText));
 const concept=checks.map(c=>({label:c.ar,hit:(c.terms||[]).some(t=>tx.includes(norm(t)))}));
 return `<div class="ex-feedback" role="status"><h3>🧭 ملاحظات أولية — ليست تصحيحاً ذكياً كاملاً</h3>
 <p>هذه مراجعة محلية للكلمات المفتاحية وبعض الأخطاء الإملائية فقط؛ لا تستنتج صحة أو خطأ القرار المحاسبي من غياب كلمة، ولا تمنح درجة نهائية.</p>
 ${concept.length?`<div class="ex-check-grid">${concept.map(c=>`<div class="ex-chip ${c.hit?'found':'unseen'}">${c.hit?'✓ وردت عبارة قريبة من: ':'○ راجع عند المقارنة: '}${esc(c.label)}</div>`).join('')}</div>`:'<p>هذه بطاقة أضفتها بنفسك؛ لا يوجد مفتاح محاسبي مبرمج لها، قارِن بالنموذج أو استخدم التصحيح في ChatGPT.</p>'}
 ${misses.length?`<p><strong>إملاء يستحق المراجعة:</strong> ${misses.map(([a,b])=>`${esc(a)} ← ${esc(b)}`).join(' · ')}</p>`:'<p>لم تُكتشف الأخطاء الإملائية الشائعة الموجودة في قائمة الفحص الصغيرة؛ هذا لا يعني أن الفرنسية خالية من الأخطاء.</p>'}

}

let exerciseRecognition=null;

function setExerciseAudioStatus(m){exerciseAudioMessage=m;const el=document.getElementById('ex-audio-message');if(el)el.textContent=m;}
function stopExerciseInput(){

 if(exerciseRecognition){try{exerciseRecognition.abort();}catch(e){}exerciseRecognition=null;}
 if(exerciseRecorder&&exerciseRecorder.state==='recording'){try{exerciseRecorder.stop();}catch(e){}}

}

function exSpeak(part,lang){if(lang!=='fr')return;const e=activeExercise();const v=e[part+'Fr'];if(v)spoken(v,'fr');}
function exCopyReview(){
 const e=activeExercise(),p=state.exerciseProgress[e.id]||{};
 const prompt=`أنا أتدرب على الحسابات الدائنة بالفرنسية. صحّح إجابتي التالية على سؤال مهني في تمرين وهمي، مع تقييم منفصل للغة الفرنسية والمنطق المحاسبي. لا تختلق معلومات ولا تطلب إعادة التحقق من حقائق محسومة في المعطيات، ولا تنتقل إلى التمرين التالي. اقترح صياغة فرنسية واحدة بسيطة وسهلة الحفظ.\n\nSituation : ${e.situationFr}\n\nQuestion : ${e.questionFr}\n\nMa réponse :\n${(p.draft||'').trim()||'[سأملي الإجابة في المحادثة]'}\n\nRéponse de référence (للمقارنة فقط، ليست معياراً حرفياً لإجابتي): ${e.answerFr}`;
 function fallback(){const t=document.createElement('textarea');t.value=prompt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(err){}t.remove();return ok;}
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(prompt).then(()=>toast('✅ نُسخ السؤال وإجابتك. الصقهما في ChatGPT للتصحيح المفصل.')).catch(()=>toast(fallback()?'✅ نُسخ الطلب. الصقه في ChatGPT.':'تعذر النسخ تلقائياً؛ افتح ChatGPT من المتصفح.'));}
 else toast(fallback()?'✅ نُسخ الطلب. الصقه في ChatGPT.':'تعذر النسخ تلقائياً؛ يمكنك نسخ إجابتك يدوياً.');
}
function exDictate(){
 if(exerciseRecognition){try{exerciseRecognition.stop();}catch(err){}exerciseRecognition=null;setExerciseAudioStatus('انتهى الإملاء.');return;}
 if(!voiceSupported){setExerciseAudioStatus('⚠️ التعرف على الكلام غير متاح هنا. افتح PWA على HTTPS عبر متصفح يدعم الإملاء، أو استخدم ميكروفون لوحة المفاتيح.');document.getElementById('exercise-answer-text')?.focus();return;}
 let rec;try{rec=new SpeechRecognitionApi();}catch(err){setExerciseAudioStatus('تعذر تشغيل التعرف الصوتي في المتصفح.');return;}
 const targetId=activeExercise().id;
 rec.lang='fr-CA';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;
 exerciseRecognition=rec;setExerciseAudioStatus('🎙️ أستمع لإجابتك بالفرنسية…');
 rec.onresult=ev=>{if(exerciseRecognition!==rec)return;const said=String(ev.results?.[0]?.[0]?.transcript||'').trim();if(!said)return;const p=state.exerciseProgress[targetId]||{};p.draft=((p.draft||'').trim()+' '+said).trim().slice(0,4000);state.exerciseProgress[targetId]=p;persist();if(activeExercise().id===targetId){const field=document.getElementById('exercise-answer-text');if(field)field.value=p.draft;setExerciseAudioStatus('✅ تم تحويل الصوت إلى نص. راجع الكلمات قبل طلب التصحيح.');}};
 rec.onerror=ev=>{if(exerciseRecognition!==rec)return;setExerciseAudioStatus('⚠️ لم ينجح الإملاء الصوتي: '+String(ev.error||'تعذر الوصول').replace(/</g,''));};
 rec.onend=()=>{if(exerciseRecognition===rec)exerciseRecognition=null;};
 try{rec.start();}catch(err){exerciseRecognition=null;setExerciseAudioStatus('⚠️ فشل بدء الإملاء. اسمح بالميكروفون أو استخدم لوحة المفاتيح.');}
}
async function exRecord(){
 if(exerciseRecorder?.state==='recording'){exerciseRecorder.stop();setExerciseAudioStatus('جارٍ تجهيز التسجيل الصوتي…');return;}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){setExerciseAudioStatus('⚠️ التسجيل الصوتي لا يعمل في هذا المتصفح أو من هذا العنوان. جرّب HTTPS أو استخدم ميكروفون لوحة المفاتيح.');return;}
 const targetId=activeExercise().id;let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(err){setExerciseAudioStatus('⚠️ لا يمكن تشغيل الميكروفون. تحقق من الأذونات.');return;}
 if(activeExercise().id!==targetId){stream.getTracks().forEach(t=>t.stop());return;}
 exerciseRecorderStream=stream;
 const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
 let recorder;try{recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(err){stream.getTracks().forEach(t=>t.stop());setExerciseAudioStatus('⚠️ فشل إنشاء التسجيل الصوتي.');return;}
 exerciseRecorder=recorder;let chunks=[];
 recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};
 recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(exerciseRecorderStream===stream)exerciseRecorderStream=null;if(!chunks.length){setExerciseAudioStatus('لم يُحفظ صوت. حاول مجدداً.');return;}const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(activeExercise().id!==targetId)return;if(exerciseAudioState?.url)URL.revokeObjectURL(exerciseAudioState.url);exerciseAudioState={id:targetId,url:URL.createObjectURL(blob),ext:blob.type.includes('mp4')?'m4a':'webm'};setExerciseAudioStatus('✅ تسجيل مؤقت جاهز. نزّله قبل إغلاق النافذة أو تغيير التمرين للاحتفاظ به. لا يوجد تفريغ أو تصحيح تلقائي.');render();};
 recorder.onerror=()=>{setExerciseAudioStatus('⚠️ حدث خطأ في التسجيل.');stream.getTracks().forEach(t=>t.stop());};
 try{recorder.start();setExerciseAudioStatus('🔴 التسجيل جارٍ… اضغط «إيقاف التسجيل» عند الانتهاء.');const b=document.querySelector('[data-action="ex-record"]');if(b)b.textContent='⏹ إيقاف التسجيل';}catch(err){stream.getTracks().forEach(t=>t.stop());setExerciseAudioStatus('⚠️ تعذر البدء بالتسجيل.');}
}

function go(page,reset=true){cancelSpeechPlayback();if(ui.kidouWindow)stopExerciseInput();ui.kidouWindow=null;if(voiceIsListening)stopVoice();ui.page=page;if(page==='cards'&&reset){ui.cardsMode='all';ui.cardsCat='all';prepCards();}if(page==='quiz'&&reset)createQuiz();if(page==='exercises'&&reset){ui.exerciseIdx=0;resetExerciseView();}if(page==='match'&&reset)createMatch();if(page==='dictionary'&&reset){ui.filter='all';ui.search='';}render();try{window.scrollTo({top:0,behavior:'instant'});}catch(e){}}
async function compress(file){if(!file)return null;if(file.size>14*1024*1024)throw Error('الصورة أكبر من 14 ميغابايت');return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let size=460,k=Math.min(1,size/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.width*k));can.height=Math.max(1,Math.round(im.height*k));can.getContext('2d').drawImage(im,0,0,can.width,can.height);URL.revokeObjectURL(url);resolve(can.toDataURL('image/jpeg',.65));};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('الصورة غير صالحة'));};im.src=url;});}
function exportBackup(){let payload={app:'Sollio Vocab Quest',version:9,exportedAt:new Date().toISOString(),customWords:state.customWords,progress:state.progress,favorites:state.favorites,reviewList:state.reviewList,exerciseProgress:state.exerciseProgress,customExercises:state.customExercises,points:state.points,dailyDay:state.dailyDay,dailyWords:state.dailyWords,voiceLang:ui.voiceLang};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sollio-Vocab-Backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('تم تصدير الكلمات والمفضلة والمراجعات ✅');}
async function importBackup(file){if(!file)return;try{const src=JSON.parse(await file.text());if(!src||typeof src!=='object')throw Error('ملف غير صالح');const entries=src.customWords||src.words||[];if(!Array.isArray(entries))throw Error('صيغة الكلمات غير صحيحة');let added=0;const oldToNew={};for(const x of entries){if(!x||typeof x.fr!=='string'||typeof x.ar!=='string')continue;let existing=words().find(w=>norm(w.fr)===norm(x.fr));if(existing){if(x.id)oldToNew[x.id]=existing.id;continue;}let id=(typeof x.id==='string'&&/^u[a-zA-Z0-9_-]{4,40}$/.test(x.id)&&!lookup(x.id))?x.id:('u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));if(x.id)oldToNew[x.id]=id;let w={id,fr:x.fr.slice(0,130),ar:x.ar.slice(0,150),en:String(x.en||'—').slice(0,150),exFr:String(x.exFr||'').slice(0,300),exAr:String(x.exAr||'').slice(0,300),exEn:String(x.exEn||'').slice(0,300),cat:CATS[x.cat]?x.cat:'expressions',icon:CATS[x.cat]?.[1]||'📝'};if(/^data:image\/(jpeg|png|webp);base64,/.test(x.photo||''))w.photo=x.photo;state.customWords.push(w);added++;}
const validIds=new Set(words().map(x=>x.id));if(src.progress&&typeof src.progress==='object'){for(const [oldId,p] of Object.entries(src.progress)){const id=oldToNew[oldId]||oldId;if(validIds.has(id)&&p&&typeof p==='object'&&Number.isFinite(p.level)){state.progress[id]={level:Math.min(5,Math.max(0,p.level)),due:Number.isFinite(p.due)?p.due:0,seen:Number.isFinite(p.seen)?p.seen:0};}}}
for(const key of ['favorites','reviewList']){if(Array.isArray(src[key]))state[key]=[...new Set([...state[key],...src[key].map(id=>oldToNew[id]||id).filter(id=>validIds.has(id))])];}if(Array.isArray(src.customExercises)){for(const candidate of src.customExercises.slice(0,100)){if(!candidate||typeof candidate!=='object')continue;
const fields=['title','arTitle','situationFr','situationAr','questionFr','questionAr','answerFr','answerAr'];if(fields.some(k=>typeof candidate[k]!=='string'||!candidate[k].trim()))continue;
if(state.customExercises.length>=100)break;
const duplicate=state.customExercises.some(x=>norm(x.questionFr)===norm(candidate.questionFr)&&norm(x.situationFr)===norm(candidate.situationFr));if(duplicate)continue;
let id=typeof candidate.id==='string'&&/^cx[a-zA-Z0-9_-]{5,45}$/.test(candidate.id)&&!allExercises().some(x=>x.id===candidate.id)?candidate.id:('cx'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const limits={title:100,arTitle:100,situationFr:2000,situationAr:2000,questionFr:700,questionAr:700,answerFr:2000,answerAr:2000};const x={id,source:'custom',sourceLabel:'حالة أضفتها أنت',checks:[]};for(const k of fields)x[k]=candidate[k].slice(0,limits[k]);state.customExercises.push(x);}}
if(src.exerciseProgress&&typeof src.exerciseProgress==='object'&&!Array.isArray(src.exerciseProgress)){const validExercises=new Set(allExercises().map(e=>e.id));for(const [id,p] of Object.entries(src.exerciseProgress)){if(validExercises.has(id)&&p&&typeof p==='object'){const existing=state.exerciseProgress[id]||{};state.exerciseProgress[id]={done:!!(existing.done||p.done),review:!!(existing.review||p.review),draft:String(p.draft||existing.draft||'').slice(0,4000)};}}}
if(Number.isFinite(src.points))state.points=Math.max(state.points,src.points);if(['fr-CA','en-CA','ar-SA'].includes(src.voiceLang)){state.voiceLang=src.voiceLang;ui.voiceLang=src.voiceLang;}persist();go('dictionary');toast('تم الاستيراد: '+added+' كلمة جديدة وحفظ التقدم ✅');}catch(err){toast('فشل الاستيراد: '+err.message);}}

if(a==='flip'){ui.flipped=!ui.flipped;render();return;}
if(a==='next-card'){kidouMove(1);return;}
if(a==='rate-hard'||a==='rate-easy'){const cw=lookup(ui.cardIds[ui.cardIdx]);if(cw)stamp(cw.id,a==='rate-easy');if(ui.cardIdx<ui.cardIds.length-1)ui.cardIdx++;ui.flipped=false;render();return;}
if(a==='favorite'||a==='mark-review'){toggleList(a==='favorite'?'favorites':'reviewList',id);render();return;}
if(a==='choice'){if(!ui.quiz||ui.quiz.selected!==null)return;ui.quiz.selected=id;const good=id===ui.quiz.ids[ui.quiz.index];if(good)ui.quiz.correct++;stamp(ui.quiz.ids[ui.quiz.index],good);render();return;}
if(a==='next-quiz'){ui.quiz.index++;ui.quiz.selected=null;createChoices();render();return;}
if(a==='new-quiz'){createQuiz();render();return;}
if(a==='new-match'){createMatch();render();return;}
if(a==='match-pick'){let m=ui.match;if(!m||m.solved.includes(id))return;let side=el.dataset.side;if(!m.selected||m.selected.side===side){m.selected={side,id};render();return;}if(m.selected.id===id){m.solved.push(id);stamp(id,true);toast('✅ صحيح! +10 نقاط');}else{toast('حاول مرة أخرى');}m.selected=null;render();return;}
if(a==='export'){exportBackup();return;}
if(a==='delete-word'&&w&&w.id.startsWith('u')&&confirm('هل تريد حذف هذه الكلمة؟')){state.customWords=state.customWords.filter(x=>x.id!==id);delete state.progress[id];state.favorites=state.favorites.filter(x=>x!==id);state.reviewList=state.reviewList.filter(x=>x!==id);persist();render();toast('تم حذف الكلمة');return;}
});
app.addEventListener('input',e=>{if(e.target.id==='kidou-card-search'||e.target.id==='kidou-ex-search'){const field=e.target.value.trim(),query=norm(field);const grid=document.getElementById(e.target.id==='kidou-card-search'?'kidou-word-grid':'kidou-ex-grid');grid?.querySelectorAll('.kidou-tile[data-filter-text]').forEach(b=>{b.hidden=!b.dataset.filterText.includes(query);});return;}if(e.target.id==='exercise-answer-text'){const x=activeExercise(),p=state.exerciseProgress[x.id]||{};p.draft=String(e.target.value||'').slice(0,4000);state.exerciseProgress[x.id]=p;persist();if(ui.exerciseFeedback){ui.exerciseFeedback=false;const fb=document.querySelector('.ex-feedback');if(fb)fb.remove();}return;}if(e.target.id==='term-search'){ui.search=e.target.value;document.getElementById('vocab-results').innerHTML=dictionaryList();}if(e.target.id==='quick-search'){ui.search=e.target.value;ui.filter='all';ui.page='dictionary';render();document.getElementById('term-search')?.focus();}});
app.addEventListener('change',async e=>{if(e.target.id==='exercise-select'){resetExerciseView();ui.exerciseIdx=Math.max(0,Math.min(allExercises().length-1,Number(e.target.value)||0));render();return;}if(e.target.id==='voice-language'){ui.voiceLang=e.target.value;state.voiceLang=ui.voiceLang;persist();}if(e.target.id==='cards-category'){ui.cardsCat=e.target.value;prepCards();render();}if(e.target.id==='cards-mode'){ui.cardsMode=e.target.value;prepCards();render();}if(e.target.id==='term-filter'){ui.filter=e.target.value;document.getElementById('vocab-results').innerHTML=dictionaryList();}if(e.target.id==='reading-slow')ui.slow=e.target.checked;if(e.target.id==='quiz-lang'){ui.quizLang=e.target.value;if(ui.quiz?.selected===null)createChoices();render();}if(e.target.id==='match-lang'){ui.matchLang=e.target.value;createMatch();render();}if(e.target.id==='import-json')await importBackup(e.target.files?.[0]);});
app.addEventListener('submit',e=>{if(e.target.id!=='ex-add-form')return;e.preventDefault();
 const f=e.target,x=new FormData(f),fields=['title','arTitle','situationFr','situationAr','questionFr','questionAr','answerFr','answerAr'];
 const limits={title:100,arTitle:100,situationFr:2000,situationAr:2000,questionFr:700,questionAr:700,answerFr:2000,answerAr:2000};
 const v={};for(const k of fields){v[k]=String(x.get(k)||'').trim().slice(0,limits[k]);if(!v[k]){toast('أكمل جميع حقول السؤال قبل الحفظ.');return;}}
 if(state.customExercises.length>=100){toast('وصلت إلى الحد الأقصى للأسئلة المضافة (100).');return;}
 const id='cx'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 state.customExercises.push({...v,id,source:'custom',sourceLabel:'حالة أضفتها أنت',checks:[]});persist();resetExerciseView();ui.exerciseIdx=allExercises().length-1;render();toast('✅ أُضيف السؤال إلى تمارينك.');
});
app.addEventListener('submit',async e=>{if(e.target.id!=='add-word-form')return;e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]'),x=new FormData(f),fr=String(x.get('fr')||'').trim(),ar=String(x.get('ar')||'').trim(),en=String(x.get('en')||'').trim();if(!fr||!ar||!en)return;if(words().some(w=>norm(w.fr)===norm(fr))){toast('هذه الكلمة موجودة؛ ابحث عنها في القاموس');return;}b.disabled=true;try{let cat=String(x.get('cat')||'expressions');let photo=await compress(f.querySelector('[name=photo]').files?.[0]);state.customWords.push({id:'u'+Date.now().toString(36),fr,ar,en,exFr:String(x.get('exFr')||'').trim(),exAr:String(x.get('exAr')||'').trim(),exEn:String(x.get('exEn')||'').trim(),cat,icon:CATS[cat]?.[1]||'📘',...(photo?{photo}:{})});persist();go('dictionary');toast('تمت إضافة المفردة بثلاث لغات ✅');}catch(err){toast(err.message);b.disabled=false;}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

 let kidouTouchStart=null;
 document.addEventListener('keydown',event=>{if(!ui.kidouWindow)return;if(event.key==='Escape'){event.preventDefault();kidouClose();return;}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(event.key==='ArrowLeft'){event.preventDefault();kidouMove(1);}if(event.key==='ArrowRight'){event.preventDefault();kidouMove(-1);}});
 app.addEventListener('touchstart',event=>{if(!ui.kidouWindow||!event.target.closest('.kidou-dialog-content')||event.target.closest('input,textarea,select,audio,button')){kidouTouchStart=null;return;}const t=event.touches[0];kidouTouchStart=t?{x:t.clientX,y:t.clientY}:null;},{passive:true});
 app.addEventListener('touchend',event=>{if(!kidouTouchStart||!ui.kidouWindow)return;const t=event.changedTouches[0];if(!t)return;const dx=t.clientX-kidouTouchStart.x,dy=t.clientY-kidouTouchStart.y;kidouTouchStart=null;if(Math.abs(dx)>=85&&Math.abs(dy)<65)kidouMove(dx>0?-1:1);},{passive:true});
 
render();

document.addEventListener('keydown',event=>{
 if(event.key!=='Tab'||!ui.kidouWindow)return;
 const dialog=document.querySelector('.kidou-dialog');
 const items=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],audio[controls]')].filter(el=>el.getClientRects().length);
 const first=items[0],last=items[items.length-1];
 if(!dialog.contains(document.activeElement)){event.preventDefault();(event.shiftKey?last:first)?.focus();}
 else if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
});

</script>

 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>toast('تعذر تجهيز وضع عدم الاتصال. أعد فتح التطبيق عند توفر الاتصال.')));
}
